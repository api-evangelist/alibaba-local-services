description: 'Alibaba Local Services (阿里巴巴本地生活) is Alibaba Group''s on-demand local-life
  services business, formed in 2018 by integrating the Ele.me food-delivery platform with the Koubei
  local-services and restaurant-discovery platform. It operates on-demand food and grocery delivery,
  local merchant services, reviews and reservations, and last-mile logistics across China, and received
  a major financing round led by the SoftBank Vision Fund. This API Evangelist profile was surfaced as a
  SoftBank Vision Fund portfolio company and added to the network as a lead; no distinct public developer
  API surface has been confirmed for the holding entity under this name (its consumer platforms Ele.me and
  Koubei operate their own separate open platforms).'
